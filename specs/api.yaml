openapi: "3.1.0"
info:
  title: "[Project Name] API"
  version: "1.0.0"
  description: "Define all API endpoints here before implementation begins."

servers:
  - url: "http://localhost:3000/api/v1"
    description: "Local development"

paths:
  # NOTE (CR-020): kun /api/track er beskrevet her så langt. Resten av API-et
  # er ikke dokumentert i denne filen. Server-URL over er malverdi, faktisk
  # base er /api.
  # CR-025: admin-ruter for web-løpet. Alle krever admin-cookie (JWT), sjekket i hver rute
  # (middleware beskytter ikke /api/admin). 401 uten innlogging, 404 ved ukjent id.
  /api/admin/flow-pages:
    get: { operationId: listFlowPages, summary: "Liste sider (ikke slettet)", responses: { "200": { description: "OK" }, "401": { description: "Ikke autentisert" } } }
    post:
      operationId: createFlowPage
      summary: "Opprett side"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                text: { type: string, nullable: true, maxLength: 1000 }
                imageUrl: { type: string, nullable: true }
                imageAlt: { type: string, nullable: true, maxLength: 200 }
                sortOrder: { type: integer, default: 0 }
                isActive: { type: boolean, default: true }
      responses:
        "201": { description: "{id}" }
        "400": { description: "Ugyldig input" }
        "401": { description: "Ikke autentisert" }
  /api/admin/flow-pages/{id}:
    get: { operationId: getFlowPage, summary: "Hent side", responses: { "200": { description: "OK" }, "404": { description: "Ikke funnet" } } }
    patch: { operationId: updateFlowPage, summary: "Oppdater side (delvis)", responses: { "200": { description: "OK" }, "400": { description: "Ugyldig input" }, "404": { description: "Ikke funnet" } } }
    delete: { operationId: deleteFlowPage, summary: "Slett side (soft delete)", responses: { "204": { description: "Slettet" }, "404": { description: "Ikke funnet" } } }
  /api/admin/benefits/{id}/products:
    get: { operationId: listBenefitProducts, summary: "Liste produkter på en fordel (ikke slettet)", responses: { "200": { description: "OK" }, "404": { description: "Fordel ikke funnet" } } }
    post:
      operationId: createBenefitProduct
      summary: "Opprett produkt på fordel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                text: { type: string, nullable: true, maxLength: 500 }
                priceText: { type: string, nullable: true, maxLength: 80 }
                sortOrder: { type: integer, default: 0 }
                isActive: { type: boolean, default: true }
      responses:
        "201": { description: "{id}" }
        "400": { description: "Ugyldig input" }
        "404": { description: "Fordel ikke funnet" }
  /api/admin/benefits/{id}/products/{productId}:
    patch: { operationId: updateBenefitProduct, summary: "Oppdater produkt (delvis)", responses: { "200": { description: "OK" }, "404": { description: "Ikke funnet" } } }
    delete: { operationId: deleteBenefitProduct, summary: "Slett produkt (soft delete)", responses: { "204": { description: "Slettet" }, "404": { description: "Ikke funnet" } } }
  /api/admin/benefits/{id}/web-placement:
    put:
      operationId: setWebPlacement
      summary: "Plasser fordel på en side i web-løpet, eller fjern plasseringen"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pageId]
              properties:
                pageId: { type: string, format: uuid, nullable: true, description: "null = ikke i løpet" }
                sortOrder: { type: integer, default: 0 }
      responses:
        "200": { description: "OK" }
        "400": { description: "Ugyldig input" }
        "404": { description: "Fordel eller side ikke funnet" }
  /api/admin/benefits/{id}/views/{format}:
    put:
      operationId: setBenefitViewOverrides
      summary: "Sett innholdsoverstyringer for en fordel på en flate (CR-027)"
      description: >
        Setter overstyringene for (fordel, format, variant standard). Alle felt erstatter
        eksisterende verdier, manglende eller tomme felt blir null (arv fra fordelen). Oppretter
        raden om den mangler. Rører aldri plassering (page_id, sort_order). format må være i
        format-registeret (app_card, web_card), ellers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, nullable: true, maxLength: 120 }
                text: { type: string, nullable: true, maxLength: 500 }
                imageUrl: { type: string, nullable: true, maxLength: 500 }
                imageAlt: { type: string, nullable: true, maxLength: 200 }
                badgeText: { type: string, nullable: true, maxLength: 40 }
      responses:
        "200": { description: "OK, de lagrede feltene" }
        "400": { description: "Ugyldig input" }
        "401": { description: "Ikke autentisert" }
        "404": { description: "Fordel eller format ikke funnet" }
  # PATCH /api/admin/benefits/{id} utvides med showInApp (boolean, CR-025).
  /api/flow/order:
    post:
      operationId: submitFlowOrder
      summary: "Send inn bestilling fra web-løpet (CR-024)"
      description: >
        Offentlig, anonym (sesjon fra x-anon-id). Linjene valideres mot løpet slik det er for
        sesjonen. Samme submissionId to ganger gir samme ordre uten duplikat. Persondata logges aldri.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submissionId, name, email, consentShare, lines]
              properties:
                submissionId: { type: string, format: uuid }
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email, maxLength: 200 }
                phone: { type: string, maxLength: 30 }
                postcode: { type: string, pattern: "^[0-9]{4}$" }
                consentShare: { type: boolean, description: "Må være true" }
                consentEmail: { type: boolean, default: false }
                consentMail: { type: boolean, default: false }
                consentSms: { type: boolean, default: false }
                lines:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [benefitId, productId]
                    properties:
                      benefitId: { type: string, format: uuid }
                      productId: { type: string, format: uuid }
      responses:
        "201": { description: "Ordre opprettet, {orderId}" }
        "200": { description: "Samme submissionId sendt før, samme {orderId}" }
        "400": { description: "VALIDATION_ERROR (felt) eller INVALID_LINES (linjer som ikke er i løpet)" }
        "429": { description: "Rate limit (10 per time per IP), Retry-After settes" }
        "500": { description: "INTERNAL_ERROR" }
  /api/track:
    post:
      operationId: trackEvent
      summary: "Logg en hendelse (fire-and-forget fra klient)"
      description: "Sesjon utledes fra x-anon-id-headeren. Ukjent eventType eller channel gir 400."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType]
              properties:
                eventType:
                  type: string
                  description: "Verdi fra EVENT_TYPES (src/lib/tracking/eventTypes.ts)"
                benefitId: { type: string, format: uuid }
                channel: { type: string, enum: [web, app, email], default: app }
                viewId: { type: string, maxLength: 64 }
                testId: { type: string, maxLength: 64 }
                variant: { type: string, maxLength: 64 }
                metadata: { type: object }
      responses:
        "200": { description: "OK, {ok: true}" }
        "400": { description: "VALIDATION_ERROR (ukjent eventType/channel, for lang streng)" }
        "500": { description: "INTERNAL_ERROR" }
  # CR-028: simulert Vipps-innlogging. Alle forbruker-API-er krever innlogget person (cookie
  # person_token, JWT med role=person), ellers 401. Unntatt: /api/auth/*, /api/admin/*.
  /api/auth/login:
    post:
      operationId: personLogin
      summary: "Logg inn som en testperson (simulert Vipps)"
      description: "Rate limit (Redis). Setter httpOnly cookie person_token, kobler UserSession til personen og lagrer test-e-posten på personen."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId, email]
              properties:
                personId: { type: string, format: uuid }
                email: { type: string, format: email, maxLength: 200 }
      responses:
        "200": { description: "OK, {person} (uten e-post i logg). Cookie satt." }
        "400": { description: "VALIDATION_ERROR (ugyldig e-post)" }
        "404": { description: "Ukjent person" }
        "429": { description: "RATE_LIMITED, Retry-After" }
  /api/auth/test-persons:
    post:
      operationId: createTestPerson
      summary: "Opprett en ny testperson"
      description: "Åpen for alle på /logg-inn (prototype), rate limit. Oppretter ikke innlogging, personen velges deretter via /api/auth/login."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, movingStatus]
              properties:
                name: { type: string, maxLength: 80 }
                postcode: { type: string, pattern: "^[0-9]{4}$" }
                movingStatus: { type: string, enum: [recently_moved, moved_past, not_moving, unknown] }
                movedAt: { type: string, format: date }
                fromAddress: { type: string, maxLength: 120 }
                toAddress: { type: string, maxLength: 120 }
                housingType: { type: string, enum: [enebolig, leilighet, rekkehus, annet] }
      responses:
        "201": { description: "Opprettet, {person}" }
        "400": { description: "VALIDATION_ERROR" }
        "429": { description: "RATE_LIMITED, Retry-After" }
  /api/auth/logout:
    post:
      operationId: personLogout
      summary: "Logg ut (bytt person)"
      responses:
        "200": { description: "OK, cookie fjernet" }
  # Define further endpoints here
  # /resource:
  #   get:
  #     operationId: listResource
  #     summary: "List all resources"
  #     responses:
  #       "200":
  #         description: "OK"

components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
